<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BloodBridge | Login</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
     *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Cinzel',serif;
      background:
      radial-gradient(circle at top left,#7a0000,#1a0000 70%);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      overflow-x:hidden;
      color:white;
    }

    .main-container{
      width:100%;
      max-width:1450px;
      background:rgba(20,0,0,0.85);
      border:1px solid rgba(255,0,0,0.3);
      border-radius:30px;
      padding:20px 35px 40px;
      box-shadow:
      0 0 30px rgba(255,0,0,0.25),
      inset 0 0 50px rgba(255,0,0,0.05);
      position:relative;
    }

    .main-container::before{
      content:"";
      position:absolute;
      inset:0;
      background:
      linear-gradient(to right,transparent,rgba(255,0,0,0.03),transparent);
      pointer-events:none;
    }

    /* HEADER */
    .header{
      text-align:center;
      padding:20px 0 10px;
    }

    .title{
      font-size: 54px;
      font-family:'Cinzel',serif;
      font-weight:400;
      letter-spacing:1px;
      margin:0 8px;
      text-shadow:0 0 10px rgba(255,0,0,0.4);
      color:#ff3b3b;
    }

    .line{
      margin:10px auto 25px;
      width:70%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:20px;
      color:#ff2e2e;
    }

    .line::before,.line::after{
      content:"";
      height:1px;
      flex:1;
      background:#ff2e2e;
    }

    .quote{
      text-align:center;
      color:#f2dede;
      margin-bottom:45px;
      font-size:15px;
      font-family:'Cormorant Garamond',serif;
    }

    .quote i{
      color:#ff2d2d;
      margin:0 10px;
    }

    /* CONTENT */
    .content{
      display:flex;
      gap:55px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
    }

    /* SLIDER */
    .slider-container{
      flex:1;
      width:100%;
      max-width:820px;
      position:relative;
      border:1px solid rgba(255,0,0,0.3);
      border-radius:25px;
      overflow:hidden;
      padding:18px;
      background:rgba(0,0,0,0.18);
    }

    .slider{
      display:flex;
      transition:transform 0.5s ease-in-out;
    }

    .slide{
      min-width:100%;
      height:420px;
      overflow:hidden;
      border-radius:20px;
    }

    .slide img{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#120000;
    }

    .arrow{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:58px;
      height:58px;
      border-radius:50%;
      background:#2a0000;
      border:1px solid rgba(255,0,0,0.4);
      color:white;
      font-size:28px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
      z-index:10;
    }

    .arrow:hover{
      background:#ff2020;
    }

    .left{
      left:15px;
    }

    .right{
      right:15px;
    }

    .dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:18px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:20px;
    background:#5b3030;
    cursor:pointer;
    transition:all 0.35s ease;
}

.dot.active{
    width:38px;
    background:#bf1c1c;
    box-shadow:0 0 10px rgba(255,45,45,0.6);
}

    /* LOGIN */
    .login-box{
      width:380px;
      background:rgba(25,0,0,0.88);
      border:1px solid rgba(255,0,0,0.3);
      border-radius:30px;
      padding:35px 30px;
      box-shadow:0 0 20px rgba(255,0,0,0.12);
    }

    .login-box h2{
      text-align:center;
      font-family:'Cinzel',serif;
      font-size:32px;
      font-weight:500;
      margin-bottom:10px;
    }

    .mini-line{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:15px;
      color:#ff3030;
      margin-bottom:35px;
    }

    .mini-line::before, .mini-line::after{
      content:"";
      width:100px;
      height:1px;
      background:#ff3030;
    }

    .input-group{
      margin-bottom:30px;
    }

    .input-group label{
      display:block;
      margin-bottom:12px;
      font-size:15px;
    }

    .input-box{
      position:relative;
    }

    .input-box input{
      width:100%;
      height:46px;
      border-radius:15px;
      border:1px solid rgba(255,0,0,0.3);
      background:#1a0000;
      color:white;
      padding:0 55px;
      font-size:14px;
      outline:none;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#ff3a3a;
      box-shadow:0 0 10px rgba(255,0,0,0.25);
    }

    .input-box i{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      color:#ddd;
      font-size:20px;
    }

    .input-box .left-icon{
      left:18px;
    }

    .input-box .right-icon{
      right:18px;
      cursor:pointer;
    }

    .extra{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
      font-size:15px;
    }

    .login-btn{
      width:100%;
      height:48px;
      border:none;
      border-radius:16px;
      background:linear-gradient(to bottom,#ff3030,#b50000);
      color:white;
      font-size:16px;
      font-weight:500;
      cursor:pointer;
      transition:0.3s;
      margin-bottom:30px;
    }

    .login-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 0 20px rgba(255,0,0,0.4);
    }

    /* RESPONSIVE */
    @media(max-width:1200px){
      .content{
        flex-direction:column;
      }
      .title{
      font-size: 54px;
      font-family:'Cinzel',serif;
      font-weight:400;
      letter-spacing:1px;
      margin:0 8px;
      text-shadow:0 0 10px rgba(255,0,0,0.4);
      color:#ff3b3b;
    }
    }

    @media(max-width:768px){
      .main-container{
        padding:20px;
      }
      .title{
      font-size: 54px;
      font-family:'Cinzel',serif;
      font-weight:400;
      letter-spacing:1px;
      margin:0 8px;
      text-shadow:0 0 10px rgba(255,0,0,0.4);
      color:#ff3b3b;
    }
      .quote{
        font-size:18px;
      }
      .slide{
        height:320px;
      }
      .login-box{
        width:100%;
        padding:30px 20px;
      }
      .login-box h2{
        font-size:28px;
      }
    }

  </style>
</head>

<body>

  <div class="main-container">

    <!-- HEADER -->
    <div class="header">
      <h1 class="title">
        Blood Bridge
      </h1>

      <div class="line">
        <i class="fa-solid fa-droplet"></i>
      </div>

      <p class="quote">
        <i class="fa-solid fa-heart"></i>
        Donate blood, save lives. Together, we can make a difference.
        <i class="fa-solid fa-heart"></i>
      </p>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- IMAGE SLIDER -->
      <div class="slider-container">
        <div class="slider" id="slider">

          <div class="slide">
            <img src="login_img_1.png" alt="Blood Donation">
          </div>

          <div class="slide">
            <img src="login_img_2.png" alt="Blood Donation">
          </div>

          <div class="slide">
            <img src="login_img_3.png" alt="Blood Donation">
          </div>

          <div class="slide">
            <img src="login_img_4.png" alt="Blood Donation">
          </div>

          <div class="slide">
            <img src="login_img_5.png" alt="Blood Donation">
          </div>
        </div>

        <button class="arrow left">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button class="arrow right">
          <i class="fa-solid fa-chevron-right"></i>
        </button>

        <div class="dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- LOGIN FORM -->
      <div class="login-box">
        <h2>Welcome Back</h2>

        <div class="mini-line"><i class="fa-solid fa-droplet"></i></div>

        <form id="loginForm">

          <div class="input-group">
            <label for="username">Email or Username</label>
            <div class="input-box">
              <i class="fa-regular fa-user left-icon"></i>
              <input type="text" id="username" name="username" placeholder="Enter your email or username">
            </div>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-box">
              <i class="fa-solid fa-lock left-icon"></i>
              <input type="password" id="password" name="password" placeholder="Enter your password">
              <i class="fa-regular fa-eye right-icon"
                id="togglePassword"></i>
            </div>
          </div>

          <div class="extra">
            <label for="remember">
              <input type="checkbox" id="remember"> Remember me
            </label>
          </div>

          <button type="submit" class="login-btn">SIGN IN</button>

        </form>
      </div>
    </div>
  </div>

  <script>
  const slider = document.getElementById("slider");
  document.querySelector(".left")
    .addEventListener("click", prevSlide);

  document.querySelector(".right")
    .addEventListener("click", nextSlide);

  const dots = document.querySelectorAll(".dot");
  let index = 0;
  const totalSlides = document.querySelectorAll(".slide").length;

  function updateSlider() {
      slider.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach(dot => dot.classList.remove("active"));
      dots[index].classList.add("active");
  }

  function nextSlide() {
      index++;
      if (index >= totalSlides) {
          index = 0;
      }
      updateSlider();
  }

  function prevSlide() {
      index--;
      if (index < 0) {
          index = totalSlides - 1;
      }
      updateSlider();
  }

  /* AUTO SLIDE */
  setInterval(() => {
      nextSlide();
  }, 3000);

  /* PASSWORD TOGGLE */
  const togglePassword = document.getElementById("togglePassword");
  const password = document.getElementById("password");
  togglePassword.addEventListener("click", () => {
      const type =
          password.getAttribute("type") === "password"
          ? "text"
          : "password";
      password.setAttribute("type", type);
      togglePassword.classList.toggle("fa-eye");
      togglePassword.classList.toggle("fa-eye-slash");
  });

  /* LOGIN REDIRECT */
  const loginForm = document.getElementById("loginForm");
  loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "index.html";
  });

  </script>
</body>
</html>
